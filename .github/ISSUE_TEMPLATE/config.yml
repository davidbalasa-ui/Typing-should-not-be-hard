# Blank issues stay on: the only form is the crash report (the app's crash screen points at it), and
# taking away the plain "New issue" box would leave people with nowhere to file an ordinary bug.
blank_issues_enabled: true
contact_links:
  - name: 🔒 Report a security vulnerability (private)
    url: https://github.com/davidbalasa-ui/Typing-should-not-be-hard/security
    about: >-
      Anything that could be used against someone's device or data, such as a leaked API key or
      another app reading what you type. Reported privately, not in a public issue. See SECURITY.md.
