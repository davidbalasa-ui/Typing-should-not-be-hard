# Builds, tests and publishes the TypeBetter keyboard.
#
# - Every push and pull request: run the unit tests and build a release APK.
# - Push to main: publish the APK as a GitHub release (Obtainium installs and updates from these), with
#   the matching Play app bundle (TypeBetter.aab) beside it. If the repository secret
#   PLAY_SERVICE_ACCOUNT_JSON is set, the bundle also goes to the Play internal testing track, where the
#   Play Store installs and updates it. See docs/play/README.md.
# - Push to a claude/* work branch: build and test only. Work branches never see the release key and
#   never publish, so nothing unreviewed can reach the phone as an update.
#
# The cloud container used for development cannot download Android SDK packages, so this workflow is
# the only place the app is compiled.
#
# Signing: Android only installs an update over an app signed with the same key. The key lives in
# signing/typebetter-release.p12. This repository is public, so that file is protected by a password
# that is not the secret itself but the secret stretched through scrypt (1 GiB of memory per guess),
# which makes guessing it offline impractically slow. The first main build that sees the secret
# TYPEBETTER_KEYSTORE_PASSWORD and no key file creates the key and commits the encrypted file. Only main
# builds receive the secret. See signing/README.md.
name: TypeBetter build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: typebetter-${{ github.ref }}
  # main is never cancelled half way, so a release (or the first key commit) always finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  translator:
    # The on-device translator (Bergamot) is a native library built from source; the app refuses to
    # build without it. Built once here and cached until its build script or tool versions change.
    name: Translator library
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libdictate_bergamot.so
          key: bergamot-${{ hashFiles('tools/bergamot/**', 'gradle/tools.versions.toml') }}
      - name: Install NDK and CMake
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ndk=$(grep '^ndk ' gradle/tools.versions.toml | sed -E 's/.*"(.*)".*/\1/')
          cmake=$(grep '^cmake ' gradle/tools.versions.toml | sed -E 's/.*"(.*)".*/\1/')
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" "cmake;$cmake" > /dev/null
      - name: Build the translator library
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/bergamot/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bergamot
          path: app/src/main/jniLibs/arm64-v8a/libdictate_bergamot.so
          retention-days: 1

  test:
    name: Unit tests
    needs: translator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Fetch on-device speech libraries
        run: tools/fetch-sherpa-onnx.sh
      - uses: actions/download-artifact@v4
        with:
          name: bergamot
          path: app/src/main/jniLibs/arm64-v8a
      - name: Release key step never replaces the key
        run: tools/test-release-key-step.sh
      - name: Play upload script (against a local mock of the Play API)
        run: tools/test-play-upload.sh
      - name: TypeBetter rules tests
        run: ./gradlew --no-daemon :lib:typebetter:test
      - name: App unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

  apk:
    name: Build APK
    needs: translator
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      # Only used to commit the encrypted key file the first time, and only main ever gets the secret.
      contents: write
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The build scripts below never get a token that can write to the repository.
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Fetch on-device speech libraries
        run: tools/fetch-sherpa-onnx.sh
      - uses: actions/download-artifact@v4
        with:
          name: bergamot
          path: app/src/main/jniLibs/arm64-v8a
      - name: Signing setup
        id: signing
        env:
          # Only a push or manual run of main ever receives the secret. Work branches and pull requests get
          # an empty value, so their (unreviewed) build scripts never hold the release key.
          SECRET: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && secrets.TYPEBETTER_KEYSTORE_PASSWORD || '' }}
          PUSH_TOKEN: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) && github.token || '' }}
          REF: ${{ github.ref_name }}
        run: |
          key=signing/typebetter-release.p12
          if [ -z "$SECRET" ]; then
            if [ "$REF" = "main" ]; then
              echo "::warning::TYPEBETTER_KEYSTORE_PASSWORD is not set. This APK is signed with a throwaway key, cannot update an installed TypeBetter and is not published."
            else
              echo "Work branch or pull request: built with a throwaway key and not published."
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#SECRET}" -lt 16 ]; then
            echo "::error::TYPEBETTER_KEYSTORE_PASSWORD is shorter than 16 characters. The key file is public, so use a long password (four or more random words, or 20+ random characters) and run again."
            exit 1
          fi
          # The password that opens the key: the secret stretched through scrypt (N=2^20, r=8: about one
          # second and 1 GiB per guess). Never written anywhere but this runner's memory and keystore.properties.
          KEYSTORE_PASSWORD=$(SECRET="$SECRET" python3 -c 'import os,hashlib;print(hashlib.scrypt(os.environ["SECRET"].encode(),salt=b"typebetter-release-key-v1",n=2**20,r=8,p=1,maxmem=2**31-1,dklen=32).hex())')
          echo "::add-mask::$KEYSTORE_PASSWORD"
          # The key on the newest main is the only real key. Never trust the checked-out commit for this:
          # a re-run of an older main build, or a push queued behind the build that made the key, checks out
          # a commit from before the key existed, and making a key then would replace the real one on main
          # (phones would refuse every later update). Ask main itself.
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fetched=false
          for attempt in 1 2 3; do
            if git fetch --depth=1 "$remote" main; then fetched=true; break; fi
            sleep $((attempt * 10))
          done
          if [ "$fetched" != true ]; then
            echo "::error::Could not read main to look for the release key. Nothing was made or published; run again."
            exit 1
          fi
          if git cat-file -e "FETCH_HEAD:$key" 2>/dev/null; then
            mkdir -p signing
            git show "FETCH_HEAD:$key" > "$key"
          else
            # One key for every build, made once on main: phones only accept updates signed with the key
            # they installed.
            mkdir -p signing
            # Only for a new key (an existing key must keep opening with the secret it was made with):
            # length alone lets "passwordpassword" or "aaaaaaaaaaaaaaaa" through. Four random words, or 20
            # random characters, always use well over ten different characters.
            if [ "$(printf '%s' "$SECRET" | fold -w1 | sort -u | wc -l)" -lt 10 ]; then
              echo "::error::TYPEBETTER_KEYSTORE_PASSWORD repeats too few different characters to be safe in a public repository. Use four or more random words, or 20+ random characters, and run again."
              exit 1
            fi
            keytool -J-Dkeystore.pkcs12.keyPbeIterationCount=1000000 -J-Dkeystore.pkcs12.macIterationCount=1000000 \
              -genkeypair -keystore "$key" -storetype PKCS12 -alias typebetter \
              -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=TypeBetter, O=TypeBetter personal build"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Commit the key file on top of the newest main (main may have moved while this build ran),
            # without touching the checked-out tree being built. If saving fails, stop: nothing is
            # published, and the next run makes a fresh key.
            pushed=false
            for attempt in 1 2 3; do
              if git fetch --depth=1 "$remote" main; then
                if git cat-file -e "FETCH_HEAD:$key" 2>/dev/null; then
                  # Another main build saved a key first: that one is the real key. Use it, never replace it.
                  git show "FETCH_HEAD:$key" > "$key"
                  pushed=true; break
                fi
                rm -f "$RUNNER_TEMP/key-index"
                GIT_INDEX_FILE="$RUNNER_TEMP/key-index" git read-tree FETCH_HEAD
                GIT_INDEX_FILE="$RUNNER_TEMP/key-index" git update-index --add "$key"
                tree=$(GIT_INDEX_FILE="$RUNNER_TEMP/key-index" git write-tree)
                commit=$(git commit-tree "$tree" -p FETCH_HEAD -m "Add the TypeBetter release key (encrypted, see signing/README.md)")
                if git push "$remote" "$commit:refs/heads/main"; then pushed=true; break; fi
              fi
              sleep $((attempt * 10))
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not save the new release key to main (is main protected?). Nothing was published."
              exit 1
            fi
          fi
          if ! keytool -list -keystore "$key" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::The release key does not open with TYPEBETTER_KEYSTORE_PASSWORD. The secret must be exactly the one the key was made with; see signing/README.md."
            exit 1
          fi
          {
            echo "storeFile=$key"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=typebetter"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build release APK and Play bundle
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          # Upstream Dictate's versionCode is 142; ours counts on from 142000 so every build is an update.
          TB_VERSION_CODE=$((142000 + GITHUB_RUN_NUMBER))
          BASE_VERSION=$(grep '^projectVersionName=' gradle.properties | cut -d= -f2 | cut -d- -f1)
          TB_VERSION_NAME="$BASE_VERSION-typebetter.$GITHUB_RUN_NUMBER"
          # The APK and the app bundle come from the same build, with the same version code. The bundle is
          # signed with the release key, which Play keeps as the upload key (Google re-signs for phones).
          if [ "$SIGNED" = "true" ]; then
            ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease \
              -PprojectVersionCode="$TB_VERSION_CODE" -PprojectVersionName="$TB_VERSION_NAME"
          else
            # Without the secret, the benchmark type is the release build signed with a debug key. Its bundle
            # is built too, only to prove the bundle still builds; it is never uploaded.
            ./gradlew --no-daemon :app:assembleBenchmark :app:bundleBenchmark \
              -PprojectVersionCode="$TB_VERSION_CODE" -PprojectVersionName="$TB_VERSION_NAME"
          fi
      - name: Name the APK
        run: |
          rm -f keystore.properties
          mkdir -p out
          apk=$(find app/build/outputs/apk -name '*.apk' \( -path '*release*' -o -path '*benchmark*' \) | head -n 1)
          [ -n "$apk" ] || { echo "::error::No APK was built"; exit 1; }
          # One fixed name, so .../releases/latest/download/TypeBetter.apk is always the newest build.
          cp "$apk" "out/TypeBetter.apk"
          aab=$(find app/build/outputs/bundle -name '*.aab' \( -path '*release*' -o -path '*benchmark*' \) | head -n 1)
          [ -n "$aab" ] || { echo "::error::No app bundle was built"; exit 1; }
          cp "$aab" "out/TypeBetter.aab"
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: TypeBetter-apk
          path: out/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TypeBetter-aab
          path: out/*.aab

  publish:
    name: Publish
    needs: [test, apk]
    # Only main publishes. Work branches never get the release key (see Signing setup), so nothing
    # unreviewed can be installed over the real app.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.apk.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TypeBetter-apk
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: TypeBetter-aab
          path: out
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          tag="v$RUN"; title="TypeBetter build $RUN"
          notes="Built from ${SHA:0:7} on $REF. Install TypeBetter.apk below, or let Obtainium keep it updated. TypeBetter.aab is the same build for the Google Play Console (not installable on a phone)."
          # A re-run of this job finds its release already made: replace the files instead of failing.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" out/TypeBetter.apk out/TypeBetter.aab --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" out/TypeBetter.apk out/TypeBetter.aab --repo "$GITHUB_REPOSITORY" --target "$SHA" \
              --title "$title" --notes "$notes"
          fi

  play:
    name: Google Play internal test
    needs: [test, apk]
    # Same gate as Publish: only a reviewed main build, signed with the real key, ever reaches Play.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.apk.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One Play upload at a time, in order, never cancelled half way (an edit left open blocks the next).
    concurrency:
      group: typebetter-play
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tools/play-upload.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: TypeBetter-aab
          path: out
      - name: Upload to the internal testing track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          RUN: ${{ github.run_number }}
        run: |
          # Optional: without the secret the bundle is still on the GitHub release for a manual upload.
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "PLAY_SERVICE_ACCOUNT_JSON is not set, so nothing goes to Google Play. TypeBetter.aab is on the GitHub release for a manual upload (docs/play/README.md)."
            exit 0
          fi
          # Same version code as the Build step: 142000 + run number.
          tools/play-upload.sh out/TypeBetter.aab com.typebetter.keyboard internal "TypeBetter build $RUN" $((142000 + RUN))
